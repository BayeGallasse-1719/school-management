<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion École – Étudiants</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <span>🎓</span>
        Gestion École
      </div>
      <nav>
        <a href="index.html" class="nav-link active">📋 Étudiants</a>
        <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
      </nav>
      <div style="margin-top:auto; padding:1rem; font-size:0.8rem; opacity:0.6;">
        API FastAPI · PostgreSQL
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="page-header">
        <div>
          <h1>Liste des étudiants</h1>
          <p class="subtitle">Gestion, recherche et archivage</p>
        </div>
        <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
          <button class="btn btn-success" id="btnImport">⬆ Import JSON</button>
          <button class="btn btn-primary" id="btnAjouter">+ Ajouter</button>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Rechercher (nom, prénom, numéro)…">
        </div>
        <select class="filter" id="filterClasse">
          <option value="">Toutes les classes</option>
        </select>
        <select class="filter" id="filterSource">
          <option value="">Toutes sources</option>
          <option value="DB">DB</option>
          <option value="JSON">JSON</option>
        </select>
        <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.9rem; cursor:pointer;">
          <input type="checkbox" id="filterArchive">
          Voir archivés
        </label>
      </div>

      <!-- Table -->
      <div class="table-card" id="listePanel">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Numéro</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Date naissance</th>
                <th>Classe</th>
                <th>Utilisateur</th>
                <th>Source</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="9" class="loading"><div class="spinner"></div>Chargement…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <div class="pagination-info" id="paginationInfo">—</div>
          <div class="pagination-btns" id="paginationBtns"></div>
        </div>
      </div>

      <!-- Detail Panel -->
      <div class="detail-panel" id="detailPanel">
        <button class="btn btn-outline mb-2" id="btnRetour">← Retour à la liste</button>
        <div class="bulletin" id="bulletinContent"></div>
      </div>
    </main>
  </div>

  <!-- Modal Ajout / Édition -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Ajouter un étudiant</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <form id="formEtudiant">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label for="numero">Numéro *</label>
              <input type="text" id="numero" maxlength="7" pattern="[A-Z0-9]{7}" required placeholder="EX: LIHGFR0">
            </div>
            <div class="form-group">
              <label for="user_at">Code utilisateur *</label>
              <input type="text" id="user_at" maxlength="6" pattern="[A-Z]{3}[0-9]{3}" required placeholder="EX: AAD004">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="nom">Nom *</label>
              <input type="text" id="nom" minlength="2" required>
            </div>
            <div class="form-group">
              <label for="prenom">Prénom *</label>
              <input type="text" id="prenom" minlength="2" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="date_naissance">Date de naissance *</label>
              <input type="date" id="date_naissance" required>
            </div>
            <div class="form-group">
              <label for="classe">Classe *</label>
              <input type="text" id="classe" required placeholder="EX: 6eme A">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="btnAnnuler">Annuler</button>
          <button type="submit" class="btn btn-primary" id="btnSubmit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
</body>
</html>
